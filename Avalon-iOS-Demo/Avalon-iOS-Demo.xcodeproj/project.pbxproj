			shellScript = "scan_directory=\"${SRCROOT}/${TARGETNAME}/TestGroup\"\necho \"扫描路径: $scan_directory\"\n\noutput_json=\"${SRCROOT}/${TARGETNAME}/TestGroup.json\"\necho \"产出路径: $output_json\"\n\n#declare -a folder_array\n#\n#for dir in $(find \"$scan_directory\" -mindepth 1 -maxdepth 1 -type d); do\n#    folder_name=$(basename \"$dir\")\n#    echo \"文件夹: $folder_name\"\n#    folder_array+=(\"\\\"$folder_name\\\"\")\n#done\n#\n#echo \"{ \\\"folders\\\": [$(IFS=,; echo \"${folder_array[*]}\")] }\" > \"$output_json\"\n\nfunction dir_to_json() {\n    local dir=\"$1\"\n    local indent=\"$2\"\n    local first=1\n\n    echo \"{\"\n    echo \"$indent  \\\"name\\\": \\\"$(basename \"$dir\")\\\",\"\n    echo \"$indent  \\\"type\\\": \\\"directory\\\",\"\n    echo \"$indent  \\\"contents\\\": [\"\n\n    # 遍历文件夹内容\n    local entries=(\"$dir\"/*)\n    for entry in \"${entries[@]}\"; do\n        # 添加逗号\n        if [ \"$first\" -ne 1 ]; then\n            echo \",\"\n        fi\n        first=0\n\n        if [ -d \"$entry\" ]; then\n            # 如果是目录，递归调用\n            dir_to_json \"$entry\" \"$indent    \"\n        else\n            # 如果是文件，打印文件信息\n            echo \"$indent    {\"\n            echo \"$indent      \\\"name\\\": \\\"$(basename \"$entry\")\\\",\"\n            echo \"$indent      \\\"type\\\": \\\"file\\\"\"\n            echo \"$indent    }\"\n        fi\n    done\n\n    echo \"\"\n    echo \"$indent  ]\"\n    echo \"$indent}\"\n}\n\ndir_to_json \"$scan_directory\" \"\" > \"$output_json\"\n    \napp_main_bundle=\"${BUILT_PRODUCTS_DIR}/${PRODUCT_NAME}.app/TestGroup.json\"\n\ncp \"$output_json\" \"$app_main_bundle\"\n\necho \"完成json文件生成: $app_main_bundle\"\n\n";
		};
